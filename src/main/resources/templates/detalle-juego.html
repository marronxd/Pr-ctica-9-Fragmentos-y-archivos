<th:block th:replace ="~{layout/base :: layout(~{::title}, ~{::main})}">
    <title th:text="${juego.titulo}"></title>
    <main>
        <h2 class ="text-gradient" th:text="${juego.titulo}"></h2>
        <a th:href="@{/juego/{id}(id=${juego.id})}" class="btn-primary">Nuevo Juego</a>

        <div>
            <div class="game-details">
                <img th:src="${#strings.startsWith(juego.portadaUrl, 'http')} ? ${juego.portadaUrl} : @{/uploads/{img}(img=${juego.portadaUrl})}"
                     alt="Portada del juego">
            </div>
            <div class ="game-descripcion">
                <span class="pill" th:text="${juego.categoria}"></span>
                <span th:text="${juego.precio}"></span>
                <p th:text="${juego.descripcion}"></p>
                <p th:text="${juego.categoria}"></p>
            </div>

            <form th:action ="@{/juegos/eliminar/{id}(id=${juego.id})}" method ="post"
            >
                <button type="submit" class="btn btn-primary" style="margin-top: 10px; width: 100%;">
                    Eliminar
                </button>
            </form>

        </div>

    </main>
</th:block>
