spring.application.name=GameShop

# Subida de archivos (límite de 2MB)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gameshop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Kayden

# JPA: crea/actualiza la tabla "juegos" automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true